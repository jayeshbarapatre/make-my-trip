<!doctype html>
<html lang="en" data-theme="business">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripOra - Travel Made Easy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
      (function() {
        const savedTheme = localStorage.getItem('daisyui-theme') || 'business';
        document.documentElement.setAttribute('data-theme', savedTheme);
      })();
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display: none; visibility: hidden; opacity: 0; position: absolute; pointer-events: none;"></div>
    <script type="text/javascript">
      // Pre-set the google translation cookie before the script loads to prevent flash of English
      (function() {
        const savedLang = localStorage.getItem('mmt-lang') || 'EN';
        if (savedLang !== 'EN') {
          const cookieVal = '/en/' + savedLang.toLowerCase();
          document.cookie = 'googtrans=' + cookieVal + '; path=/';
          document.cookie = 'googtrans=' + cookieVal + '; path=/; domain=' + window.location.hostname;
        }
      })();

      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,es,de',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
