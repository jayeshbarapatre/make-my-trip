# =============================================================================
# Nginx — HTTPS reverse proxy for TripOra
# =============================================================================
# - Terminates TLS for the frontend (static SPA from dist/) and the backend API
# - Proxies /api/* -> backend:5000
# - Forces HTTPS, sets security headers, and proxies real client IPs so the
#   Express rate limiter sees origin IPs (not nginx's container IP).
#
# Usage:
#   1) Put your fullchain.pem + privkey.pem in deploy/nginx/certs/
#      (or mount Let's Encrypt's /etc/letsencrypt/live/<domain> instead)
#   2) Replace YOUR_DOMAIN with your real hostname
#   3) Start via: docker compose -f docker-compose.prod.yml up -d
#
# For local TLS testing without a cert, use the self-signed snippet at the
# bottom of this file.
# =============================================================================

# Rate-limit zone for the API. 10 req/s/IP burst-friendly.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream backend service (the Express container on the prod network).
upstream mmt_backend {
    server backend:5000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP -> HTTPS redirect (port 80). Certbot/Let's Encrypt uses /.well-known too.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt HTTP-01 challenge must be served over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is permanently redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS server (port 443). Serves the SPA and proxies the API.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ── TLS certificates ──
    # Mount certs at /etc/nginx/certs/ (see docker-compose.prod.yml volumes).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern cipher suite + TLS 1.2/1.3 only (A+ on SSL Labs).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling speeds up the first handshake.
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──
    # HSTS is also set by Express in production, but set it here too so static
    # assets and the SPA are covered even if a request never hits the API.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Maximum body size for file uploads (hotel images, etc.). Keep in step with
    # the Express body limit where reasonable.
    client_max_body_size 10m;

    # ── API reverse proxy ──
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://mmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Razorpay webhook: allow a little more time for signature verify + booking ──
    location = /api/payment/webhook {
        proxy_pass http://mmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── SPA static assets (built by the frontend container) ──
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache immutable hashed assets from Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: unknown routes return index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML; the hashed asset URLs inside it change on deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}

# =============================================================================
# SELF-SIGNED CERT FOR LOCAL TLS TESTING (not for production)
# Run once, then point ssl_certificate / ssl_certificate_key at these files:
#
#   openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#     -keyout deploy/nginx/certs/privkey.pem \
#     -out  deploy/nginx/certs/fullchain.pem \
#     -subj "/CN=localhost"
# =============================================================================
