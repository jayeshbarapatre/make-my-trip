name: E2E

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["*"]

jobs:
  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: makemytrip-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: makemytrip-frontend/package-lock.json

      # The previous version ran `npm ci` at the repository root, which has no
      # package.json — so this workflow had never once succeeded. Playwright and
      # its config now live with the app whose dependency they are.
      - run: npm ci

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('makemytrip-frontend/package-lock.json') }}

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and serves the frontend itself, and the
      # specs only touch routes that render from bundled data — so this needs no
      # API, no Firestore and no credentials, and cannot fail because a quota
      # ran out. Desktop and a mobile viewport, since layout is where the
      # regressions have been.
      - name: Run
        run: npx playwright test --project=chromium --project=mobile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: makemytrip-frontend/playwright-report/**
          retention-days: 7
